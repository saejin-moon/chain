[server]
bind_addr = "127.0.0.1:8080"

[decision_model]
backend = "mock" # "http" | "llama_cpp" | "mock"
api_format = "system_one" # "system_one" (baselabs/joey-1) | "llama_server"
model_path = "baselabs/joey-1"
endpoint = "http://127.0.0.1:8081"
device = "gpu" # "cpu" | "gpu"
physical_cores = 8
kv_cache_type = "bf16"
max_state_frame_tokens = 500
max_digest_tokens = 120

[generator_model]
backend = "mock" # "http" | "llama_cpp" | "mock"
api_format = "open_ai" # "open_ai" (vLLM Qwen/Qwen3.5-9B) | "llama_server"
model_path = "Qwen/Qwen3.5-9B"
endpoint = "http://127.0.0.1:8082"
device = "gpu"
kv_cache_type = "fp8"
max_verify_tokens = 64
max_synthesis_tokens = 512

[stats]
target_alpha = 0.10
aci_gamma = 0.03
aci_alpha_min = 0.01
aci_alpha_max = 0.40
tau_ood = 0.25
tau_clean = 0.10
bocpd_hazard = 0.05
bocpd_trigger_prob = 0.75
w_pert_max = 1.5
sprt_alpha = 0.01
sprt_beta = 0.01

[evsi]
cost_s2_seconds = 1.2
cost_ask_seconds = 15.0
q_s2_accuracy = 0.85
lambda_severity = 1.0
lambda_irrev = 2.0
